<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InvMan – Reset Password</title>
  <link rel="stylesheet" href="res/stylesheets/forma.css">
  <link rel="stylesheet" href="res/stylesheets/popup.css">
  <script src="scripts/reset-password.js" type="module"></script>
</head>
<body>

<header class="center">
  <h1>InvMan</h1>
</header>

<main>
  <section class="card">

    <h2 class="center">Reset your password</h2>
    <p class="center">
      Enter your new password below.
    </p>

    <form id="resetForm">
      <input type="hidden" name="userId" value="" />
      <input type="hidden" name="resetToken" value="" />

      <div>
        <label for="newPassword">New password</label>
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          placeholder="Minimum 8 characters"
          autocomplete="new-password"
        />
      </div>

      <div>
        <label for="confirmPassword">Confirm new password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="Repeat new password"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="primary">
        Update Password
      </button>

      <p class="trust center">
        Remembered your password?
        <a href="login.html">Sign in</a>
      </p>

    </form>

  </section>
</main>

<footer class="center">
  <p>© 2024 InvMan Inc.</p>
</footer>
<div id="popup-container"></div>
</body>
</html>
